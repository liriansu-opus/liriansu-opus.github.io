<div class="site-footer">
  <div class="site-footer-left">
    <div class="site-footer-item">
      <span id="busuanzi_container_site_pv" style="display:none"> PV: <span id="busuanzi_value_site_pv"></span> </span>
    </div>
    <div class="site-footer-item">
      <span id="busuanzi_container_site_uv" style="display:none"> UV: <span id="busuanzi_value_site_uv"></span> </span>
    </div>
  </div>

  <div class="site-footer-right">
    {{- /* Saving lang-pref makes the auto-redirect honor a manual choice. */ -}}
    {{- range .Translations }}
    <div class="site-footer-item">
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" onclick="try{localStorage.setItem('lang-pref','{{ .Language.Lang }}')}catch(e){}">{{ .Language.Label }}</a>
    </div>
    {{- end }}
  </div>
</div>
